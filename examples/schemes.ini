; UTF-8. Loaded once on startup; restart the app after editing.
; builtin is always available and cannot be replaced.
[app]
version=1
startup=builtin
next_scheme_hotkey=Ctrl+Alt+F10

[scheme.coding]
name=代码符号
base=builtin
Shift+LeftBracket=U+007B
Shift+RightBracket=U+007D
Quote=pass

[scheme.chinese]
name=中文标点
base=empty
Comma=U+FF0C
Period=U+3002
Semicolon=U+FF1B
Shift+Semicolon=U+FF1A
Shift+Key1=U+FF01
Shift+Slash=U+FF1F
Shift+Key9=U+FF08
Shift+Key0=U+FF09
